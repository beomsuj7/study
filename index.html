<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>📚 Study Notes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="개인 학습 내용 정리 저장소">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Docsify Theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <!-- Prism 코드 하이라이팅 테마 -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/prismjs@1/themes/prism-tomorrow.min.css">
  <style>
    :root {
      --theme-color: #5B6DCD;
      --theme-color-light: #EEF0FB;
      --text-color: #2c3e50;
      --code-bg: #1e1e2e;
      --sidebar-bg: #f8f9fc;
      --sidebar-width: 280px;
      --border-color: #e8eaed;
    }

    /* 기본 폰트 */
    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--text-color);
      -webkit-font-smoothing: antialiased;
    }

    /* 사이드바 */
    .sidebar {
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      padding-top: 1.2rem;
    }
    .sidebar .app-name {
      font-weight: 700;
      font-size: 1.1rem;
      padding: 0.8rem 1.5rem;
      color: var(--theme-color);
    }
    .sidebar .sidebar-nav ul li a {
      font-size: 13.5px;
      color: #555;
      padding: 6px 0;
      transition: color 0.2s, padding-left 0.2s;
    }
    .sidebar .sidebar-nav ul li a:hover {
      color: var(--theme-color);
      padding-left: 4px;
    }
    .sidebar .sidebar-nav ul li.active > a {
      color: var(--theme-color);
      font-weight: 600;
      border-right: 3px solid var(--theme-color);
    }
    .sidebar .sidebar-nav > ul > li > p {
      font-weight: 600;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin: 1.2rem 0 0.4rem;
    }
    .sidebar .search {
      margin: 0 1rem 1rem;
    }
    .sidebar .search .input-wrap {
      border-radius: 8px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }
    .sidebar .search input {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 13px;
      padding: 8px 12px;
    }
    .sidebar .search input:focus {
      box-shadow: 0 0 0 2px rgba(91, 109, 205, 0.2);
    }

    /* 메인 콘텐츠 */
    .markdown-section {
      max-width: 860px;
      padding: 2rem 2.5rem 4rem;
    }

    /* 제목 스타일 */
    .markdown-section h1 {
      font-weight: 700;
      font-size: 2rem;
      color: #1a1a2e;
      border-bottom: 3px solid var(--theme-color);
      padding-bottom: 0.5rem;
      margin-top: 0;
    }
    .markdown-section h2 {
      font-weight: 600;
      font-size: 1.5rem;
      color: #2d3436;
      margin-top: 2.5rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid var(--border-color);
    }
    .markdown-section h3 {
      font-weight: 600;
      font-size: 1.2rem;
      color: #444;
      margin-top: 1.8rem;
    }
    .markdown-section h4 {
      font-weight: 500;
      font-size: 1.05rem;
      color: #555;
    }

    /* 인용 블록 (요약용) */
    .markdown-section blockquote {
      background: linear-gradient(135deg, var(--theme-color-light), #f0f4ff);
      border-left: 4px solid var(--theme-color);
      border-radius: 0 8px 8px 0;
      padding: 1rem 1.2rem;
      margin: 1rem 0 1.5rem;
      color: #4a5568;
      font-size: 0.95rem;
    }
    .markdown-section blockquote p {
      margin: 0;
    }

    /* 코드 블록 */
    .markdown-section code {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.85em;
      background: #f1f3f5;
      color: #e74c3c;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .markdown-section pre {
      background: var(--code-bg) !important;
      border-radius: 10px;
      padding: 1.2rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      margin: 1rem 0;
      overflow-x: auto;
    }
    .markdown-section pre code {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.82em;
      background: transparent;
      color: #abb2bf;
      padding: 0;
      line-height: 1.7;
    }

    /* 테이블 */
    .markdown-section table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      margin: 1rem 0;
    }
    .markdown-section table thead tr {
      background: var(--theme-color);
      color: #fff;
    }
    .markdown-section table thead th {
      padding: 10px 14px;
      font-weight: 500;
      font-size: 0.9em;
      text-align: left;
    }
    .markdown-section table tbody tr {
      border-bottom: 1px solid var(--border-color);
    }
    .markdown-section table tbody tr:nth-child(even) {
      background: #fafbfc;
    }
    .markdown-section table tbody tr:hover {
      background: var(--theme-color-light);
    }
    .markdown-section table td {
      padding: 10px 14px;
      font-size: 0.9em;
    }

    /* 리스트 */
    .markdown-section ul li,
    .markdown-section ol li {
      margin: 0.3rem 0;
      line-height: 1.7;
    }

    /* 구분선 */
    .markdown-section hr {
      border: none;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--border-color), transparent);
      margin: 2rem 0;
    }

    /* 이미지 */
    .markdown-section img {
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      max-width: 100%;
      margin: 1rem 0;
    }

    /* 링크 */
    .markdown-section a {
      color: var(--theme-color);
      text-decoration: none;
      border-bottom: 1px dashed rgba(91, 109, 205, 0.3);
      transition: border-color 0.2s;
    }
    .markdown-section a:hover {
      border-bottom-color: var(--theme-color);
    }

    /* YAML frontmatter 숨기기 (docsify에서 --- 가 hr로 렌더링될 수 있음) */
    .markdown-section > hr:first-child {
      display: none;
    }

    /* 페이지네이션 */
    .docsify-pagination-container {
      border-top: 1px solid var(--border-color);
      margin-top: 3rem;
      padding-top: 1.5rem;
    }
    .pagination-item-title {
      font-weight: 600;
      color: var(--theme-color);
    }

    /* 스크롤바 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #999;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .markdown-section {
        padding: 1.5rem 1rem 3rem;
      }
      .markdown-section h1 {
        font-size: 1.6rem;
      }
    }

    /* 다크모드 토글 */
    body.dark {
      --text-color: #e0e0e0;
      --sidebar-bg: #1a1a2e;
      --border-color: #2d2d44;
      --theme-color-light: #2a2a4a;
      background: #16162a;
    }
    body.dark .markdown-section {
      color: #e0e0e0;
    }
    body.dark .markdown-section h1 { color: #fff; }
    body.dark .markdown-section h2 { color: #ddd; }
    body.dark .markdown-section h3 { color: #ccc; }
    body.dark .markdown-section code {
      background: #2a2a4a;
      color: #ff6b6b;
    }
    body.dark .sidebar {
      background: var(--sidebar-bg);
      color: #ccc;
    }
    body.dark .sidebar .sidebar-nav ul li a {
      color: #aaa;
    }
    body.dark .sidebar .search .input-wrap {
      background: #2a2a4a;
      border-color: #3d3d5c;
    }
    body.dark .sidebar .search input {
      color: #e0e0e0;
    }
  </style>
</head>
<body>
  <div id="app">📚 로딩 중...</div>
  <script>
    window.$docsify = {
      name: '📚 Study Notes',
      repo: 'beomsuj7/study',
      loadSidebar: true,
      loadNavbar: false,
      subMaxLevel: 3,
      sidebarDisplayLevel: 1, // 모든 사이드바 1단계까지만 표시 (접기 활성화)
      auto2top: true,
      homepage: 'README.md',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '🔍 검색어를 입력하세요...',
        noData: '😅 결과를 찾을 수 없습니다',
        depth: 4,
      },
      pagination: {
        previousText: '← 이전',
        nextText: '다음 →',
        crossChapter: true,
      },
      themeColor: '#5B6DCD',
      // frontmatter 플러그인
      frontMatter: {
        installed: true,
        parseMarkdown: function(content) {
          // YAML frontmatter 제거
          return content.replace(/^---[\s\S]*?---\n*/m, '');
        }
      },
    }

    // YAML frontmatter 제거 플러그인
    function frontMatterPlugin(hook) {
      hook.beforeEach(function(content) {
        return content.replace(/^---\n[\s\S]*?\n---\n*/m, '');
      });
    }

    // 다크모드 토글 플러그인
    function darkModePlugin(hook) {
      hook.mounted(function() {
        var btn = document.createElement('button');
        btn.id = 'dark-mode-toggle';
        btn.innerHTML = '🌙';
        btn.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:999;width:42px;height:42px;border-radius:50%;border:none;background:#5B6DCD;color:#fff;font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(91,109,205,0.4);transition:transform 0.2s;';
        btn.onmouseover = function() { this.style.transform = 'scale(1.1)'; };
        btn.onmouseout = function() { this.style.transform = 'scale(1)'; };
        btn.onclick = function() {
          document.body.classList.toggle('dark');
          this.innerHTML = document.body.classList.contains('dark') ? '☀️' : '🌙';
          localStorage.setItem('darkMode', document.body.classList.contains('dark'));
        };
        document.body.appendChild(btn);
        // 저장된 다크모드 설정 복원
        if (localStorage.getItem('darkMode') === 'true') {
          document.body.classList.add('dark');
          btn.innerHTML = '☀️';
        }
      });
    }

    window.$docsify.plugins = [frontMatterPlugin, darkModePlugin];
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <!-- 사이드바 접기 플러그인 -->
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <!-- 코드 하이라이팅 -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-css.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-xml-doc.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-docker.min.js"></script>
  <!-- Copy 버튼 -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
</body>
</html>
